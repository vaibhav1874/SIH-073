# ============================================================
# SkyGuard AI - Render Blueprint Deployment Spec
# SIH26073 - Intelligent Real-Time Anomaly Detection System for AWS
# ============================================================

services:
  # ------------------------------------------------------------
  # 1. FastAPI Backend + Simulator + Pre-trained ML Engine
  # ------------------------------------------------------------
  - type: web
    name: skyguard-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: 1
      - key: RUN_SIMULATOR
        value: 1
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///data/skyguard.db

  # ------------------------------------------------------------
  # 2. React + Vite Frontend Dashboard (Static Site)
  # ------------------------------------------------------------
  - type: web
    name: skyguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: skyguard-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
